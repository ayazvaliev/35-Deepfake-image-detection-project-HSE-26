splits:
  policy: global_balanced
  seed: 42
  validation_fraction: 0.15
  test_fraction: 0.15
  author_validation_fraction: 0.2
  near_duplicate_threshold: 4
preprocessing:
  crop_policy: adaptive
  size: 256
  expansion: 1.3
  padding_value: 127
  min_face_size: 32
  min_mask_fraction: 0.25
  detection_threshold: 0.9
  output_format: PNG
sampling:
  df40_max_images: 100000
  other_dataset_max_images: 20000
